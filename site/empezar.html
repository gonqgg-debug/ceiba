<title>Arma tu página · Ceiba Labs</title>
<meta name="description" content="Cuéntanos de tu negocio y mira cómo se arma tu página. Te mandamos la versión completa sin costo.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/estudio.css">
<style>
/* ===================== EMPEZAR =====================
   Una conversación corta a la izquierda y la página del cliente armándose a la derecha,
   con la plantilla real de cada giro. Al final pedimos a dónde mandarle la versión completa. */
html,body{height:100%}
@media (min-width:901px){body{overflow:hidden}}
body{margin:0;background:var(--night);color:var(--white);font:400 16px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.e{display:grid;grid-template-columns:minmax(22rem,28rem) minmax(0,1fr);height:100svh}
/* columna de la conversación */
.e-chat{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0;overflow:hidden;border-right:1px solid var(--hair);background:var(--night)}
.e-top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.4rem}
.e-top .n-brand{font-size:1.15rem}.e-top .n-orb{width:1.5rem;height:1.5rem}
.e-top a.x{font-size:.85rem;color:var(--mist);text-decoration:none}
.e-top a.x:hover{color:var(--white)}
.e-prog{padding:0 1.4rem 1rem;display:grid;gap:.5rem}
.e-prog ol{list-style:none;margin:0;padding:0;display:flex;gap:.3rem}
.e-prog li{flex:1;height:3px;border-radius:2px;background:var(--hair);transition:background-color .4s}
.e-prog li.on{background:var(--lime)}
.e-prog span{font:500 .74rem var(--fm);color:var(--mist)}
.e-log{min-height:0;overflow-y:auto;padding:.4rem 1.4rem 1rem;display:flex;flex-direction:column;gap:.7rem;scroll-behavior:smooth}
.m{max-width:88%;padding:.7rem .95rem;border-radius:1.1rem;line-height:1.45;font-size:.95rem;animation:m-in .35s var(--enter) both}
.m.bot{background:rgba(255,255,255,.06);border-top-left-radius:.35rem}
.m.bot b{font-weight:600}
.m.me{align-self:flex-end;background:var(--cobalt);border-top-right-radius:.35rem}
.m.model{background:linear-gradient(160deg,rgba(214,250,82,.1),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(214,250,82,.25)}
.m.model small{display:block;font:500 .72rem var(--fm);color:var(--lime);margin-bottom:.25rem}
.typing{display:inline-flex;gap:.25rem;padding:.85rem 1rem}
.typing i{width:.4rem;height:.4rem;border-radius:50%;background:var(--mist);animation:t-dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes t-dot{50%{opacity:.25;transform:translateY(-2px)}}
@keyframes m-in{from{opacity:0;transform:translateY(8px)}}
/* lo que contesta el cliente */
.e-ask{padding:1rem 1.4rem 1.3rem;border-top:1px solid var(--hair);display:grid;gap:.7rem;background:color-mix(in srgb,var(--night) 94%,var(--cobalt))}
.e-ask[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem .9rem;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.03);font-size:.9rem;transition:border-color .2s,background-color .2s}
.chip:hover{border-color:rgba(255,255,255,.35)}
.chip[aria-pressed="true"]{border-color:var(--lime);background:rgba(214,250,82,.12)}
.chip svg{width:1rem;height:1rem;color:var(--lime)}
.chip.ghost{border-style:dashed;color:var(--mist)}
.row{display:flex;gap:.5rem}
.inp{flex:1;min-width:0;height:3rem;padding:0 1rem;border-radius:.9rem;border:1px solid var(--hair);background:rgba(255,255,255,.05);color:var(--white);font:400 1rem var(--fb);outline:none}
textarea.inp{height:auto;min-height:5rem;padding:.75rem 1rem;resize:none;line-height:1.45}
.inp:focus{border-color:var(--lime)}
.inp.bad{border-color:#FF9A8A}
.go{flex:none;width:3rem;height:3rem;border-radius:.9rem;border:0;background:var(--lime);color:var(--night);display:grid;place-items:center}
.go svg{width:1.2rem;height:1.2rem}
.go:disabled{opacity:.5;cursor:default}
.err{color:#FFB3A6;font-size:.85rem;margin:0}
.styles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.sty{display:grid;gap:.2rem;text-align:left;padding:.75rem .85rem;border-radius:.9rem;border:1px solid var(--hair);background:rgba(255,255,255,.03);transition:border-color .2s,background-color .2s}
.sty b{font:600 .98rem var(--fd)}
.sty span{font-size:.8rem;color:var(--mist)}
.sty i{display:flex;gap:.25rem;margin-bottom:.3rem}
.sty i em{width:1rem;height:1rem;border-radius:50%}
.sty[aria-pressed="true"]{border-color:var(--lime);background:rgba(214,250,82,.1)}
.sw{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.sw small{font-size:.8rem;color:var(--mist);margin-right:.2rem}
.sw button{width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw button[aria-pressed="true"]{border-color:var(--white)}
.next{justify-self:start}
.small{font-size:.8rem;color:var(--mist);margin:0}
/* la página armándose */
.e-pv{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:1.2rem 1.6rem 1rem;background:radial-gradient(70% 60% at 60% 0%,rgba(39,71,232,.25),transparent 70%),#060c2a}
.e-pv-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
.e-pv-top b{font:600 1rem var(--fd)}
.e-pv-top .live{display:inline-flex;align-items:center;gap:.45rem;font:500 .74rem var(--fm);color:var(--lime);opacity:0;transition:opacity .3s}
.e-pv-top .live.on{opacity:1}
.e-pv-top .live::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(214,250,82,.18)}
.dev{display:inline-flex;gap:.25rem;padding:.25rem;border-radius:999px;background:rgba(255,255,255,.06)}
.dev button{border:0;background:transparent;padding:.35rem .8rem;border-radius:999px;font-size:.82rem;color:var(--mist)}
.dev button[aria-pressed="true"]{background:var(--white);color:var(--night)}
.frame{position:relative;min-height:0;overflow:hidden}
.win{position:absolute;left:50%;top:0;border-radius:.9rem;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 2.5rem 5rem -2rem rgba(0,0,0,.7);transform-origin:top center;transition:box-shadow .3s}
.win.pulse{box-shadow:0 0 0 2px var(--lime),0 2.5rem 5rem -2rem rgba(0,0,0,.7)}
.bar{display:flex;align-items:center;gap:.4rem;height:2.4rem;padding:0 .8rem;background:#EEF1F8}
.bar i{width:.6rem;height:.6rem;border-radius:50%;background:#C9D0E3}
.bar span{margin-left:.6rem;flex:1;max-width:28rem;background:#fff;border-radius:.4rem;font:400 .8rem var(--fm);color:#4B567E;padding:.3rem .7rem}
.win iframe{display:block;border:0;background:#fff}
.e-pv-note{margin:.8rem 0 0;font-size:.78rem;color:var(--mist);text-align:center}
.e-pv-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mist);padding:2rem;pointer-events:none;transition:opacity .4s}
.e-pv-empty b{display:block;font:600 1.4rem var(--fd);color:var(--white);margin-bottom:.4rem}
.e-pv-empty.off{opacity:0}
/* listo */
.done{display:grid;gap:.8rem}
.done ol{margin:0;padding-left:1.1rem;color:var(--mist);font-size:.9rem;display:grid;gap:.3rem}
@media (max-width:900px){
  .e{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100svh}
  .e-pv{order:-1;padding:.7rem .9rem .5rem;height:34svh;grid-template-rows:auto 1fr}
  .e-pv-top{margin-bottom:.5rem}.e-pv-top>b,.e-pv-top .live{display:none}
  .e-pv-note{display:none}
  .e-pv-empty b{font-size:1.05rem}
  .e-chat{border-right:0;border-top:1px solid var(--hair)}
  .e-top{padding:.7rem 1rem}.e-prog{padding:0 1rem .6rem}.e-log{padding:.4rem 1rem .8rem}.e-ask{padding:.8rem 1rem 1rem}
  .e.big .e-pv{position:fixed;inset:0;z-index:20;height:auto}
  .e-pv .grow{display:inline-flex}
}
.grow{display:none;border:0;background:rgba(255,255,255,.08);border-radius:999px;padding:.35rem .8rem;font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function detectPresence(t) {
  const s = t.trim();
  const ig = s.match(/(?:instagram\.com\/|^|\s)@([a-z0-9._]{2,30})/i);
  if (/google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/i.test(s)) return { presence: 'social', social: s.match(/https?:\/\/\S+/)?.[0] || s };
  if (/instagram\.com\//i.test(s) || ig) return { presence: 'social', social: ig ? '@' + ig[1] : s };

function buildPage() {
  const g = GIROS[S.kind] || GIROS.otro, demo = DEMOS[S.kind] || DEMOS.otro;
  const p = structuredClone(demo.page);
  const name = S.name.trim() || demo.page.brand?.name || 'Tu negocio', city = S.city.trim();
  p.kind = S.kind === 'otro' ? 'despacho' : (S.kind || p.kind);
  const style = S.style || g.style;
  p.theme = { ...(p.theme || {}), style: style === 'fonda' && S.kind !== 'restaurante' ? 'sobria' : style };
  if (S.name) {
    p.brand = { ...(p.brand || {}), name, fullName: name, tagline: city ? `${g.label.split(' o ')[0]} en ${city}` : g.label.split(' o ')[0] };
    delete p.brand.logo; delete p.brand.logoWide;
    p.hero = { ...(p.hero || {}), title: g.hero(name, city) };
    p.footer = { note: `© 2026 ${name}` };
    p.rating = null; p.reviews = null;
    if (p.intro) p.intro = { ...p.intro, title: S.about || p.intro.title, marks: [] };
    if (p.shop) p.shop = null; // la tiendita es propia del ejemplo
  }
  if (S.color) p.brand = { ...(p.brand || {}), accent: S.color };
  if (S.about) { p.hero = { ...(p.hero || {}), sub: S.about.slice(0, 180) }; if (p.statement) p.statement = S.about.slice(0, 220); }
  if (city && p.contact) p.contact = { ...p.contact, address: city };
  if (S.kind === 'otro' && p.services) p.services = { ...p.services, title: 'Nuestros servicios', sub: 'Lo que hacemos por ti.' };
  const list = S.services.split(/[,\n;]+/).map(x => x.trim()).filter(Boolean).slice(0, 8);
  if (list.length) {
    if (S.kind === 'restaurante' && p.menu) p.menu = { ...p.menu, note: '', categories: [{ name: 'Lo que más piden', items: list.map(n => ({ name: n, desc: '', price: '' })) }] };
    else if (S.kind === 'hotel' && p.rooms) { const base = p.rooms.items; p.rooms = { ...p.rooms, note: '', items: list.map((n, i) => ({ ...base[i % base.length], name: n, desc: '', price: '' })) }; }
    else if (S.kind === 'inmobiliaria' && p.listings) { const base = p.listings.items; p.listings = { ...p.listings, note: '', items: list.map((n, i) => ({ ...base[i % base.length], title: n, price: '' })) }; }
    else if (p.services) p.services = { ...p.services, more: null, note: '', items: list.map(n => ({ name: n, desc: '' })) };
  }
  return p;
}

  win.classList.add('pulse'); $('#live').classList.add('on'); clearTimeout(pulseT); pulseT = setTimeout(() => { win.classList.remove('pulse'); $('#live').classList.remove('on'); }, 1200);
}
$$('.dev button').forEach(b => b.addEventListener('click', () => { dev = b.dataset.d; $$('.dev button').forEach(x => x.setAttribute('aria-pressed', x === b)); sizeFrame(); }));
$('#grow').addEventListener('click', () => { const big = $('#e').classList.toggle('big'); $('#grow').textContent = big ? 'Cerrar' : 'Ver en grande'; requestAnimationFrame(sizeFrame); });
addEventListener('resize', sizeFrame);

/* ---------- conversación ---------- */
const log = $('#log'), ask = $('#ask');
const scroll = () => { log.scrollTop = log.scrollHeight; };
async function bot(html, cls = '') {
  const t = document.createElement('div'); t.className = 'm bot typing'; t.innerHTML = '<i></i><i></i><i></i>'; log.appendChild(t); scroll();
  await wait(Math.min(1100, 380 + html.length * 6)); t.remove();
  const m = document.createElement('div'); m.className = 'm bot ' + cls; m.innerHTML = html; log.appendChild(m); scroll();
}
function me(text) { const m = document.createElement('div'); m.className = 'm me'; m.textContent = text; log.appendChild(m); scroll(); }
function setStep(i) { S.step = i; save(); $$('#prog li').forEach((l, k) => l.classList.toggle('on', k <= i)); $('#prog-t').textContent = `Paso ${Math.min(i + 1, 5)} de 5 · ${STEPS[i]}`; }
const show = html => { ask.innerHTML = html; ask.hidden = false; const f = ask.querySelector('input,textarea'); if (f && matchMedia('(pointer:fine)').matches) f.focus(); };
const hide = () => { ask.hidden = true; ask.innerHTML = ''; };

// Un campo de texto con botón de enviar. Devuelve lo que escribió (o el valor de un atajo).
function askText({ ph = '', area = false, value = '', chips = [], validate = v => v.trim().length >= 2 || 'Escribe un poco más.', type = 'text' } = {}) {
  return new Promise(res => {
    show(`${chips.length ? `<div class="chips">${chips.map(([v, l, cls]) => `<button type="button" class="chip ${cls || ''}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>` : ''}
      <form class="row" id="f">${area ? `<textarea class="inp" id="t" rows="3" placeholder="${esc(ph)}">${esc(value)}</textarea>` : `<input class="inp" id="t" type="${type}" autocomplete="off" placeholder="${esc(ph)}" value="${esc(value)}">`}<button class="go" aria-label="Enviar">${ICON.send}</button></form><p class="err" id="er" hidden></p>`);
    const t = $('#t'), er = $('#er');
    if (area) t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#f').requestSubmit(); } });
    t.addEventListener('input', () => { t.classList.remove('bad'); er.hidden = true; });
    $('#f').addEventListener('submit', e => { e.preventDefault(); const r = validate(t.value); if (r !== true) { t.classList.add('bad'); er.textContent = r; er.hidden = false; t.focus(); return; } hide(); res({ text: t.value.trim() }); });
    ask.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { hide(); res({ chip: b.dataset.v, label: b.textContent }); }));
  });
}
function askChoice(opts, { multi = false, pre = [] } = {}) {
  return new Promise(res => {
    show(`<div class="chips">${opts.map(([v, l]) => `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${pre.includes(v)}">${esc(l)}</button>`).join('')}</div>${multi ? '<button class="n-btn next" type="button" id="nx">Siguiente</button>' : ''}`);
    ask.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      if (!multi) { hide(); return res([b.dataset.v, b.textContent]); }
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
    }));
    $('#nx')?.addEventListener('click', () => { const v = [...ask.querySelectorAll('.chip[aria-pressed="true"]')]; hide(); res([v.map(b => b.dataset.v), v.map(b => b.textContent)]); });
  });
}
function askStyle() {
  return new Promise(res => {
    const g = GIROS[S.kind] || GIROS.otro, keys = Object.keys(STYLES).filter(k => k !== 'fonda' || S.kind === 'restaurante');
    S.style = S.style || g.style;
    show(`<div class="styles">${keys.map(k => `<button type="button" class="sty" data-v="${k}" aria-pressed="${S.style === k}"><i>${STYLES[k].c.map(c => `<em style="background:${c}"></em>`).join('')}</i><b>${STYLES[k].b}</b><span>${STYLES[k].t}</span></button>`).join('')}</div>
      <div class="sw"><small>Color principal</small>${COLORS.map(c => `<button type="button" style="background:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${S.color === c}"></button>`).join('')}</div>
      <button class="n-btn next" type="button" id="nx">Me gusta así</button>`);
    ask.querySelectorAll('.sty').forEach(b => b.addEventListener('click', () => { S.style = b.dataset.v; ask.querySelectorAll('.sty').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); render(); }));
    ask.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { const on = S.color !== b.dataset.c; S.color = on ? b.dataset.c : ''; ask.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', on && x === b)); save(); render(); }));
    $('#nx').addEventListener('click', () => { hide(); res(); });
  });
}

/* ---------- el guion ---------- */
async function run() {
  const q = (params.get('q') || '').trim(), giro = params.get('giro');
  if (q || giro) { S = { ...S, step: 0 }; }
  if (giro && GIROS[giro]) S.kind = giro;
  if (q) {
    const pres = detectPresence(q); if (pres) Object.assign(S, pres);
    S.kind = S.kind || detectKind(q);
    const rest = q.replace(/https?:\/\/\S+/g, '').replace(/@[a-z0-9._]+/gi, '').trim();
    if (rest.length > 12 && !pres?.site) S.about = rest.slice(0, 800);
  }
  setStep(0);
  if (q) me(q);
  await bot('Hola. Vamos a armar la base de tu página: te hago unas preguntas cortas y la ves armarse aquí al lado.');
  if (S.name && !q && !giro) { await bot(`¿Seguimos con <b>${esc(S.name)}</b>?`); const [v] = await askChoice([['si', 'Sí, seguir'], ['no', 'Empezar de nuevo']]); if (v === 'no') { S = { ...S, name: '', kind: '', presence: '', site: '', social: '', city: '', goals: [], about: '', services: '', style: '', color: '' }; } }

  // 1. Nombre
  if (!S.name) { await bot('¿Cómo se llama tu negocio?'); const r = await askText({ ph: 'Ej.: Taquería La Esquina' }); S.name = r.text; me(r.text); save(); render(); }

  // 2. Giro y su modelo
  setStep(1);
  if (!S.kind) {
    await bot(`¿A qué se dedica <b>${esc(S.name)}</b>?`);
    const [k, label] = await askChoice(Object.entries(GIROS).map(([v, g]) => [v, g.label])); S.kind = k; me(label);
  }
  save(); render();
  await bot(`<small>Tu modelo</small>${GIROS[S.kind].model}`, 'model');

  // 3. Página, Instagram o nada
  if (!S.presence) {
    await bot('¿Ya tienes página web, Instagram o perfil de Google? Si tienes, partimos de ahí.');
    const r = await askText({ ph: 'tunegocio.com, @tunegocio o enlace de Maps', chips: [['none', 'No tengo nada todavía', 'ghost']], validate: v => !!detectPresence(v) || 'Escribe tu página (tunegocio.com), tu Instagram (@tunegocio) o un enlace de Google Maps.' });
    if (r.chip) { S.presence = 'none'; me(r.label); } else { Object.assign(S, detectPresence(r.text)); me(r.text); }
  }
  await bot(S.presence === 'site' ? `Perfecto, usamos <b>${esc(S.site)}</b> como punto de partida: de ahí tomamos tus textos, fotos y datos para la versión completa.` : S.presence === 'social' ? 'Muy bien, de ahí tomamos tus fotos y datos.' : 'Sin problema, la armamos de cero contigo.');

  // 4. Ciudad
  if (!S.city) { await bot('¿En qué ciudad estás?'); const r = await askText({ ph: 'Ej.: Zapopan' }); S.city = r.text; me(r.text); save(); render(); }

  // 5. Metas
  setStep(2);
  await bot(`¿Qué quieres que pase cuando alguien entre a tu página? Puedes elegir varias.`);
  const [goals, gl] = await askChoice(GIROS[S.kind].goals, { multi: true, pre: S.goals }); S.goals = goals; if (gl.length) me(gl.join(', ')); save();

  // 6. Cómo lo describe y sus servicios
  if (!S.about) {
    await bot(`En una o dos frases, ¿qué hace especial a <b>${esc(S.name)}</b>?`);
    const r = await askText({ area: true, ph: 'Ej.: Tacos al pastor desde 1998, con tortillas hechas a mano.', chips: [['skip', 'Lo vemos después', 'ghost']], validate: v => v.trim().length >= 8 || 'Cuéntanos un poco más, o elige «Lo vemos después».' });
    if (!r.chip) { S.about = r.text; me(r.text); } else me(r.label);
    save(); render();
  }
  await bot(`¿Cuáles son tus ${GIROS[S.kind].items} principales? Sepáralos con comas.`);
  const rs = await askText({ area: true, value: S.services, ph: 'Ej.: Pastor, suadero, gringas, aguas frescas', chips: [['skip', 'Lo vemos después', 'ghost']], validate: v => v.trim().length >= 3 || 'Escribe al menos uno, o elige «Lo vemos después».' });
  if (!rs.chip) { S.services = rs.text; me(rs.text); } else me(rs.label);
  save(); render(rs.chip ? 'top' : 'items');

  // 7. Estilo
  setStep(3);
  await bot(`Elige el estilo que va con <b>${esc(S.name)}</b>. Lo ves cambiar al momento.`);
  await askStyle(); me(`Estilo ${STYLES[S.style].b}${S.color ? ', con mi color' : ''}`);

  // 8. A dónde mandarla
  setStep(4);
  await bot(`Así va tu página. Ahora la terminamos con calma: textos completos, tus fotos y todo revisado por una persona. <b>¿A dónde te mandamos la versión completa?</b>`);
  await contact();
}

async function contact() {
  show(`<form id="cf" style="display:grid;gap:.6rem" novalidate>
      <input class="inp" id="cn" autocomplete="name" placeholder="Tu nombre">
      <input class="inp" id="cc" autocomplete="email" placeholder="Tu WhatsApp o correo">
      <p class="err" id="ce" hidden></p>
      <button class="n-btn" id="cb" type="submit">Mándame mi página ${ICON.send.replace('<svg ', '<svg style="width:1.1rem;height:1.1rem" ')}</button>
      <p class="small">Es gratis y sin compromiso. Solo pagas si decides publicarla.</p></form>`);
  const cn = $('#cn'), cc = $('#cc'), ce = $('#ce');
  const okContact = v => { const s = v.trim(); if (s.includes('@')) return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s); const d = s.replace(/\D/g, ''); return /^[+\d\s().-]+$/.test(s) && d.length >= 8 && d.length <= 15; };
  $('#cf').addEventListener('submit', async e => {
    e.preventDefault(); ce.hidden = true;
    if (cn.value.trim().length < 2) { ce.textContent = 'Escribe tu nombre.'; ce.hidden = false; cn.focus(); return; }
    if (!okContact(cc.value)) { ce.textContent = 'Déjanos un WhatsApp con lada (ej. 33 1234 5678) o un correo.'; ce.hidden = false; cc.focus(); return; }
    const btn = $('#cb'); btn.disabled = true; btn.firstChild.textContent = 'Enviando… ';
    const styleMap = { sobria: 'moderno', expresiva: 'elegante', cercana: 'calido', fonda: 'calido' };
    const body = {
      source: 'empezar', mode: S.presence === 'site' ? 'web' : 'noweb', site: S.site, industry: GIROS[S.kind].industry, city: S.city, social: S.social,
      name: cn.value.trim(), biz: S.name, contact: cc.value.trim(), company_url: '',
      preferences: { kind: S.kind, pageStyle: S.style, style: styleMap[S.style], goals: S.goals, color: S.color || undefined, about: S.about, services: S.services },
      utm: Object.fromEntries([...params].filter(([k]) => k.startsWith('utm_'))),
    };
    try {
      const r = await fetch('/api/lead', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || Object.values(d.fields || {})[0] || 'No pudimos enviarla. Intenta de nuevo.');
      hide(); me(`${cn.value.trim()} · ${cc.value.trim()}`);
      const first = cn.value.trim().split(/\s+/)[0];
      await bot(`Listo, ${esc(first)}. ${d.dueDay ? `Te mandamos tu página <b>${esc(d.dueDay)}, ${esc(d.dueTime.replace(/\.$/, ''))}</b>` : 'Te mandamos tu página muy pronto'}, ${d.channel === 'email' ? 'a tu correo' : 'por WhatsApp'}.`);
      await bot(`<div class="done"><b>Lo que sigue</b><ol><li>Terminamos tu página con tus datos reales.</li><li>Te llega un enlace privado para verla y pedir cambios.</li><li>Si te gusta, la publicamos y la cuidamos cada mes.</li></ol><span>Cuando esté publicada, el siguiente paso puede ser un asistente que conteste tu WhatsApp. <a href="/ia" style="color:var(--lime)">Conoce cómo</a>.</span></div>`);
      try { localStorage.removeItem(KEY); } catch {}
    } catch (x) { ce.textContent = x.message; ce.hidden = false; btn.disabled = false; btn.firstChild.textContent = 'Mándame mi página '; }
  });
}

initFrame(); requestAnimationFrame(sizeFrame); new ResizeObserver(sizeFrame).observe(frame); run();
</script>

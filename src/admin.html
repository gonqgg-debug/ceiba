<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Ceiba Labs</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Funnel+Display:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
{{BASE_CSS}}
body{font-size:15px}
.a-head{display:flex;align-items:center;gap:16px;padding:16px var(--gut);border-bottom:1px solid rgba(20,24,40,.1)}
.a-head svg{height:20px;width:auto;color:var(--ivory)}
.a-head .crumb{color:var(--muted);font-size:14px}
.a-head .sp{flex:1}
.a-main{padding:24px var(--gut) 64px;max-width:1500px;margin:0 auto}
.a-main h1{font-size:28px;letter-spacing:-.02em;margin-bottom:16px}
.a-login{max-width:420px;margin:12vh auto;display:grid;gap:14px}
.btn-s{height:38px;padding:0 14px;font-size:14px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 12px var(--f-mono);color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid rgba(20,24,40,.08);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(20,24,40,.03)}
td small{display:block;color:var(--muted);font-size:13px}
.st{display:inline-block;font:500 12px/1 var(--f-mono);padding:6px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.st--hot{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.st--warn{border-color:var(--error-d);color:var(--error-d)}
.late{color:var(--error-d)}
.empty{color:var(--muted);padding:40px 0}
.d-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:18px}
.d-top h1{margin:0}
.d-grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--ink-2);border:1px solid rgba(20,24,40,.1);border-radius:14px;padding:18px;display:grid;gap:14px}
.panel h2{font-size:16px;font-family:var(--f-body);font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;font-size:14px;color:#1E1F24;background:rgba(30,122,70,.06);border:1px solid rgba(30,122,70,.25);border-radius:10px;padding:12px;max-height:260px;overflow:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme{border:1px solid rgba(20,24,40,.14);border-radius:12px;padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.theme legend{padding:0 6px;font-size:13px;color:var(--muted)}
.theme label{display:grid;gap:4px;font-size:13px}
.theme label span{color:var(--muted)}
.theme select,.theme input[type=color]{height:38px;border-radius:8px;border:1px solid rgba(20,24,40,.18);background:var(--ink);color:var(--ivory);padding:0 8px;font:inherit;width:100%}
textarea.json{width:100%;min-height:420px;font:400 12.5px/1.5 var(--f-mono);background:var(--ink);color:var(--ivory);border:1px solid rgba(20,24,40,.18);border-radius:10px;padding:12px;resize:vertical;tab-size:2}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:14px}
.msg.err{color:var(--error-d)}
.msg.ok{color:var(--lime)}
.prev{position:sticky;top:16px;display:grid;gap:10px}
.prev-bar{display:flex;gap:8px;align-items:center}
.prev-bar .sp{flex:1}
.frame-wrap{background:#fff;border-radius:12px;overflow:hidden;height:calc(100vh - 140px);display:flex;justify-content:center;border:1px solid rgba(20,24,40,.1)}
.frame-wrap iframe{border:0;width:100%;height:100%;background:#fff;transition:width .3s}
.frame-wrap.mob iframe{width:390px;border-left:1px solid #ddd;border-right:1px solid #ddd}
.sent{border:1px solid rgba(30,122,70,.35);background:rgba(30,122,70,.06);border-radius:12px;padding:14px;display:grid;gap:10px;font-size:14px}
.sent textarea{width:100%;min-height:110px;background:var(--ink);color:var(--ivory);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.5 var(--f-body)}
.a-tabs{display:flex;gap:4px}
.a-tabs a{font-size:14px;color:var(--muted);padding:7px 12px;border-radius:8px;text-decoration:none}
.a-tabs a.on{background:rgba(20,24,40,.08);color:var(--ivory)}
.st--wait{border-color:#F5B94A;color:#F5B94A}
.c-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.sol{border:1px solid rgba(20,24,40,.12);border-radius:12px;padding:14px;display:grid;gap:10px}
.sol-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.sol-h b{color:var(--ivory);font-size:14px}
.sol p{margin:0;white-space:pre-wrap;font-size:14px}
.hilo{display:grid;gap:6px;font-size:13px}
.hilo div{padding:8px 10px;border-radius:8px;background:rgba(20,24,40,.05)}
.hilo div.ing{background:rgba(30,122,70,.08)}
.hilo em{font-style:normal;color:var(--muted);font-size:12px;display:block;margin-bottom:2px}
.sol textarea,.c-send textarea{width:100%;min-height:70px;background:var(--ink);color:var(--ivory);border:1px solid rgba(20,24,40,.18);border-radius:8px;padding:10px;font:14px/1.5 var(--f-body);resize:vertical}
.sol select,.c-phase select{height:38px;border-radius:8px;border:1px solid rgba(20,24,40,.18);background:var(--ink);color:var(--ivory);padding:0 8px;font:inherit}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.files a{display:grid;gap:4px;font-size:12px;color:var(--muted);text-decoration:none;overflow-wrap:anywhere}
.files a span.th{aspect-ratio:1;border-radius:8px;background:rgba(20,24,40,.06) center/cover;display:grid;place-items:center;font:500 11px var(--f-mono);color:var(--ivory)}
.convo{display:grid;gap:10px;max-height:calc(100vh - 220px);overflow:auto;padding-right:4px}
.convo div{max-width:88%;padding:10px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.convo .bot{background:rgba(20,24,40,.05)}
.convo .me{justify-self:end;background:rgba(30,122,70,.1)}
.convo small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.dl-step{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid #EFEEEA;font-size:14px}
.dl-step:last-child{border-bottom:0}
.dl-step b{font-weight:600;color:#6B6E76}
.dl-step.ok b{color:#1E7A46}
.dns{border-collapse:collapse;font-size:13px;width:100%}
.dns th,.dns td{text-align:left;padding:6px 8px;border-bottom:1px solid #EFEEEA}
.dns code{font:12.5px var(--f-mono);word-break:break-all}
#dl-msg{width:100%;min-height:120px;border:1px solid #D9D8D3;border-radius:8px;padding:10px;font:14px/1.5 var(--f-body);resize:vertical}
@media (max-width:1000px){.c-grid{grid-template-columns:1fr}}
@media (max-width:1000px){.d-grid{grid-template-columns:1fr}.prev{position:static}.frame-wrap{height:80vh}}
/* Panel claro: fondo blanco y acentos sobrios */
body.adm{--fg:#1E1F24;--ivory:#1E1F24;--ink:#FFFFFF;--ink-2:#F8F8F6;--muted:#6B6E76;--line:#E3E2DE;--surface:#F8F8F6;--focus:#1E7A46;--error-d:#B42318;background:#fff;color:#1E1F24}
body.adm .a-head{background:#fff;border-bottom-color:#E9E8E4}
body.adm .a-head svg{color:#0C1226;--logo-tree:#1E7A46}
body.adm h1,body.adm h2{color:#0C1226}
body.adm .btn-primary{background:#0C1226;color:#fff}
body.adm .btn-primary:hover{background:#1E2540}
body.adm .btn-line{color:#1E1F24;border-color:#D9D8D3;background:#fff}
body.adm .btn-line:hover{background:#F2F2EF}
body.adm .fld input,body.adm .fld select,body.adm .fld textarea{background:#fff;border-color:#D9D8D3;color:#1E1F24}
body.adm .fld input:focus,body.adm .fld select:focus,body.adm .fld textarea:focus{border-color:#1E7A46}
body.adm .st--hot{background:#E6F4EC;color:#1E7A46;border-color:#BFE0CC}
body.adm .st--wait{border-color:#E7B65C;color:#9A6400;background:#FFF7E6}
body.adm .st--warn{color:#B42318;border-color:#F3C1BB;background:#FEF3F2}
body.adm .msg.ok{color:#1E7A46}
body.adm .panel{background:#fff;border-color:#E9E8E4;box-shadow:0 1px 2px rgba(16,18,28,.04)}
body.adm .a-tabs a.on{background:#F2F2EF;color:#0C1226}
body.adm .frame-wrap{border-color:#E9E8E4}
body.adm a{color:inherit}
body.adm .check input{accent-color:#1E7A46}
body.adm input:not([type=checkbox]):not([type=color]),body.adm textarea,body.adm select{background:#fff;color:#1E1F24;border-color:#D9D8D3}
</style>
</head>
<body class="adm">
{{SYMBOLS}}
<header class="a-head">
  <a href="/" aria-label="Ceiba Labs"><svg viewBox="0 0 249.17 54" fill="currentColor" aria-hidden="true"><use href="#ceiba-logo"/></svg></a>
  <nav class="a-tabs" id="tabs" hidden><a href="#" data-t="prop">Propuestas</a><a href="#clientes" data-t="cli">Clientes</a></nav><span class="sp"></span>
  <button class="btn btn-line btn-s" type="button" id="logout" hidden>Salir</button>
</header>
<main class="a-main" id="app" aria-live="polite"></main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = $('#app');
  const api = async (method, body, qs = '') => {
    const res = await fetch('/api/admin' + qs, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const d = await res.json().catch(() => ({ error: 'Respuesta inválida del servidor.' }));
    if (res.status === 401 && body?.action !== 'login') { login(); throw new Error('Sesión vencida'); }
    if (!res.ok) throw new Error(d.error || 'Error');
    return d;
  };
  const fmt = iso => iso ? new Intl.DateTimeFormat('es-MX', { timeZone: 'America/Mexico_City', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)) : '—';
  const THEME = {
    mode: { light: 'Claro', dark: 'Oscuro' },
    hero: { organic: 'Orgánica', rounded: 'Redondeada', square: 'Rectangular' },
    font: { moderna: 'Moderna', elegante: 'Elegante (con serif)', geometrica: 'Geométrica', clasica: 'Clásica', amable: 'Amable', sobria: 'Sobria' },
    corners: { soft: 'Suaves', sharp: 'Rectas' },
    buttons: { pill: 'Redondos', square: 'Rectangulares', outline: 'Con contorno' },
  };
  const PL = { moderno: 'Moderno y limpio', elegante: 'Elegante y premium', calido: 'Cálido y familiar', tecnologico: 'Clínico y tecnológico', light: 'Fondo claro', dark: 'Fondo oscuro', any: 'Que elija Ceiba', tu: 'De tú', usted: 'De usted', citas: 'más citas', estetica: 'tratamientos estéticos', urgencias: 'urgencias', google: 'Google', zonas: 'otras zonas', confianza: 'confianza' };
  const prefsLine = p => [p.style && PL[p.style], p.mode && PL[p.mode], p.color && (p.color === 'logo' ? 'color de su logo' : `color ${p.color}`), p.tone && PL[p.tone], p.goals?.length && `quiere: ${p.goals.map(g => PL[g]).join(', ')}`, p.ref && `le gusta: ${p.ref}`].filter(Boolean).join(' · ');
  const THEME_LABEL = { mode: 'Modo', hero: 'Foto principal', font: 'Tipografía', corners: 'Esquinas', buttons: 'Botones' };
  const LEAD = { nuevo: 'Nueva', generando: 'Armando borrador', en_revision: 'Por revisar', propuesta_enviada: 'Enviada', descartado: 'Descartada', error: 'Error' };
  const PROP = { borrador: 'Borrador', enviada: 'Enviada', vista: 'La vio', activada: 'Pagó', vencida: 'Vencida', descartada: 'Descartada' };

  function login() {
    $('#logout').hidden = true; $('#tabs').hidden = true;
    app.innerHTML = `<form class="a-login form" id="lf"><h1>Entrar al panel</h1>
      <div class="fld"><label for="tk">Token del equipo</label><input id="tk" type="password" autocomplete="current-password" required></div>
      <p class="msg err" id="lerr" hidden></p><button class="btn btn-primary" type="submit">Entrar</button>
      <p class="hint">Es el valor de CEIBA_ADMIN_TOKEN en Vercel.</p></form>`;
    $('#tk').focus();
    $('#lf').addEventListener('submit', async e => {
      e.preventDefault();
      try { await api('POST', { action: 'login', token: $('#tk').value }); route(); }
      catch (err) { $('#lerr').textContent = err.message; $('#lerr').hidden = false; }
    });
  }

  async function list() {
    app.innerHTML = '<p class="empty">Cargando…</p>';
    const { leads } = await api('GET', null, '?action=list');
    $('#logout').hidden = false;
    const now = Date.now();
    const rows = leads.map(l => {
      const p = l.proposal, views = p?.views?.[0]?.count || 0;
      const late = ['nuevo', 'generando', 'en_revision', 'error'].includes(l.status) && Date.parse(l.due_at) < now;
      const hot = l.status === 'en_revision';
      return `<tr class="row" data-slug="${esc(p?.slug || '')}" tabindex="0">
        <td>${fmt(l.created_at)}<small>${esc(l.source)}</small></td>
        <td><b>${esc(l.business)}</b><small>${esc(l.name)}</small></td>
        <td>${l.site_host ? esc(l.site_host) : '<small>Sin página</small>'}</td>
        <td>${esc(l.contact)}<small>${l.contact_type === 'email' ? 'correo' : 'WhatsApp'}</small></td>
        <td><span class="st ${hot ? 'st--hot' : l.status === 'error' ? 'st--warn' : ''}">${LEAD[l.status] || l.status}</span>${l.notes && (l.status === 'error' || /^(IA|Consultoría):/.test(l.notes)) ? `<small>${esc(l.notes).slice(0, 140)}</small>` : ''}</td>
        <td class="${late ? 'late' : ''}">${['propuesta_enviada', 'descartado'].includes(l.status) ? '—' : fmt(l.due_at)}</td>
        <td>${p ? `<span class="st">${PROP[p.status] || p.status}</span>${p.change_status ? `<small>Ajustes: ${esc(p.change_status)}</small>` : ''}<small>${views} visita${views === 1 ? '' : 's'}${p.valid_until ? ` · vence ${esc(p.valid_until)}` : ''}</small>` : '<small>Sin borrador</small>'}</td></tr>`;
    }).join('');
    app.innerHTML = `<h1>Solicitudes</h1>${leads.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Llegó</th><th>Negocio</th><th>Página</th><th>Contacto</th><th>Estado</th><th>Entregar antes de</th><th>Propuesta</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">Todavía no hay solicitudes.</p>'}`;
    app.querySelectorAll('tr.row').forEach(tr => {
      const go = () => { if (tr.dataset.slug) location.hash = tr.dataset.slug; };
      tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }

  async function detail(slug) {
    app.innerHTML = '<p class="empty">Cargando…</p>';
    const { proposal: p, countries: CTRS = [] } = await api('GET', null, `?action=get&slug=${encodeURIComponent(slug)}`);
    $('#logout').hidden = false;
    const lead = p.leads?.[0] || {};
    const content = p.content || p.ai_draft || {};
    const page = content.page || {};
    const sent = ['enviada', 'vista', 'activada'].includes(p.status);
    app.innerHTML = `
      <div class="d-top"><a class="link" href="#">← Solicitudes</a><h1>${esc(p.business)}</h1><span class="st ${p.status === 'borrador' ? 'st--hot' : ''}">${PROP[p.status] || p.status}</span>${p.content ? '' : '<span class="st">Sin revisar</span>'}</div>
      <div class="d-grid">
        <div style="display:grid;gap:16px">
          <section class="panel"><h2>Solicitud</h2><dl class="kv">
            <dt>Contacto</dt><dd>${esc(lead.name)} · ${esc(lead.contact)}</dd>
            <dt>Página</dt><dd>${lead.site_host ? `<a class="link" href="https://${esc(lead.site_host)}" target="_blank" rel="noopener">${esc(lead.site_host)}</a>` : 'No tiene'}</dd>
            ${lead.industry ? `<dt>Rubro</dt><dd>${esc(lead.industry)} · ${esc(lead.city)}</dd>` : ''}${lead.social ? `<dt>Perfil</dt><dd>${esc(lead.social)}</dd>` : ''}
            ${lead.preferences ? `<dt>Le gusta</dt><dd>${esc(prefsLine(lead.preferences))}</dd>` : ''}
            <dt>Entregar</dt><dd>${fmt(lead.due_at)}</dd>
            ${p.valid_until ? `<dt>Vigencia</dt><dd>hasta ${esc(p.valid_until)}</dd>` : ''}
          </dl></section>
          ${p.changes_requested ? `<section class="panel"><h2>Ronda de ajustes del cliente</h2>
            <dl class="kv"><dt>Estado</dt><dd>${esc({ pendiente: 'Pendiente', aplicando: 'Claude la está aplicando', aplicado: 'Aplicada', error: 'Error' }[p.change_status] || 'Sin ronda activa')}</dd><dt>Rondas usadas</dt><dd>${p.change_rounds} de 1</dd></dl>
            <div class="notes">${esc(p.changes_requested)}</div>${p.change_note ? `<p class="hint">Lo que le dijimos: ${esc(p.change_note)}</p>` : ''}
            <div class="acts">${p.content_prev ? '<button class="btn btn-line btn-s" type="button" id="undo">Deshacer sus cambios</button>' : ''}<button class="btn btn-line btn-s" type="button" id="grant">Darle otra ronda</button></div></section>` : ''}
          ${p.notes ? `<section class="panel"><h2>Notas del borrador</h2><div class="notes">${esc(p.notes)}</div></section>` : ''}
          <section class="panel"><h2>Ajustes</h2>
            <div class="fld"><label for="f-biz">Nombre del negocio</label><input id="f-biz" value="${esc(p.business)}"></div>
            <div class="row2">
              <div class="fld"><label for="f-plan">Plan recomendado</label><select id="f-plan">${['esencial', 'negocio', 'avanzado'].map(x => `<option value="${x}"${x === p.recommended_plan ? ' selected' : ''}>${x[0].toUpperCase() + x.slice(1)}</option>`).join('')}</select></div>
              <div class="fld"><label for="f-days">Vigencia (días)</label><input id="f-days" type="number" min="3" max="30" value="14"></div>
              <div class="fld"><label for="f-country">País (precios)</label><select id="f-country">${CTRS.map(c => `<option value="${c.id}"${c.id === (p.country || 'MX') ? ' selected' : ''}>${esc(c.name)} · ${c.code}</option>`).join('')}</select></div>
            </div>
            <fieldset class="theme"><legend>Diseño</legend>${Object.entries(THEME).map(([k, opts]) => `<label><span>${THEME_LABEL[k]}</span><select data-theme="${k}">${Object.entries(opts).map(([v, l]) => `<option value="${v}"${(page.theme?.[k] || Object.keys(opts)[0]) === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>`).join('')}<label><span>Color de marca</span><input type="color" id="f-accent" value="${esc(/^#[0-9a-f]{6}$/i.test(page.brand?.accent || '') ? page.brand.accent : '#1F4FD1')}"></label></fieldset>
            <label class="check"><input type="checkbox" id="f-wa"${p.whatsapp_recommended ? ' checked' : ''}>Recomendar el Asistente de WhatsApp</label>
            <label class="check"><input type="checkbox" id="f-tour"${p.touristic ? ' checked' : ''}>Nicho turístico (hotel, villa, inmobiliaria): precios de nivel 1</label>
            <div class="fld"><label for="f-json">Contenido (JSON) <span>· textos, fotos y cambios. Esquema en ops/esquema-propuesta.md</span></label><textarea class="json" id="f-json" spellcheck="false">${esc(JSON.stringify(content, null, 2))}</textarea></div>
            <p class="msg" id="msg" role="status"></p>
            <div class="acts">
              <button class="btn btn-line btn-s" type="button" id="save">Guardar y actualizar vista</button>
              <button class="btn btn-primary btn-s" type="button" id="approve">${sent ? 'Reenviar con estos cambios' : 'Aprobar y enviar'}</button>
              <button class="btn btn-line btn-s" type="button" id="discard">Descartar</button>
            </div>
            <div id="sent"></div>
          </section>
        </div>
        <div class="prev">
          <div class="prev-bar"><div class="seg seg--dark" role="radiogroup" aria-label="Pantalla"><button type="button" role="radio" aria-checked="true" data-w="desk">Computadora</button><button type="button" role="radio" aria-checked="false" data-w="mob">Celular</button></div><span class="sp"></span>
            <a class="btn btn-line btn-s" href="/vista/${esc(p.slug)}" target="_blank" rel="noopener">Vista previa ↗</a><a class="btn btn-line btn-s" href="/p/${esc(p.slug)}" target="_blank" rel="noopener">Propuesta ↗</a></div>
          <div class="frame-wrap" id="fw"><iframe id="frame" src="/vista/${esc(p.slug)}" title="Vista previa de ${esc(p.business)}"></iframe></div>
        </div>
      </div>`;
    const msg = (t, cls = '') => { const m = $('#msg'); m.textContent = t; m.className = 'msg ' + cls; };
    app.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
      app.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-checked', x === b));
      $('#fw').classList.toggle('mob', b.dataset.w === 'mob');
    }));
    const save = async () => {
      let content;
      try { content = JSON.parse($('#f-json').value); } catch (e) { msg('El JSON tiene un error: ' + e.message, 'err'); throw e; }
      content.page ||= {}; content.page.theme = Object.fromEntries([...app.querySelectorAll('[data-theme]')].map(x => [x.dataset.theme, x.value]));
      content.page.brand = { ...(content.page.brand || {}), accent: $('#f-accent').value };
      $('#f-json').value = JSON.stringify(content, null, 2);
      await api('POST', { action: 'save', slug, content, plan: $('#f-plan').value, country: $('#f-country').value, touristic: $('#f-tour').checked, whatsapp: $('#f-wa').checked, business: $('#f-biz').value });
      $('#frame').src = $('#frame').src; msg('Guardado.', 'ok');
    };
    $('#save').addEventListener('click', () => save().catch(e => msg(e.message, 'err')));
    $('#approve').addEventListener('click', async () => {
      if (!confirm(`¿Enviar la propuesta de ${p.business}? Quedará visible para el cliente.`)) return;
      try {
        await save();
        const r = await api('POST', { action: 'approve', slug, validDays: Number($('#f-days').value) });
        $('#sent').innerHTML = `<div class="sent"><b>Propuesta publicada. Vence el ${esc(r.validUntil)}.</b>
          <span>Enlace: <a class="link" href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a></span>
          ${r.emailed ? '<span>Le enviamos el correo al cliente.</span>' : r.emailError ? `<span class="msg err">No salió el correo: ${esc(r.emailError)}</span>` : ''}
          ${r.waLink ? `<a class="btn btn-primary btn-s" href="${esc(r.waLink)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>` : ''}
          ${!r.emailed ? `<label for="wa-msg" class="hint">Mensaje para copiar</label><textarea id="wa-msg" readonly>${esc(r.message)}</textarea>` : ''}</div>`;
        msg('');
      } catch (e) { msg(e.message, 'err'); }
    });
    app.querySelectorAll('[data-theme], #f-accent').forEach(x => x.addEventListener('change', () => save().catch(e => msg(e.message, 'err'))));
    $('#undo')?.addEventListener('click', async () => { if (!confirm('¿Volver a la versión anterior a sus cambios?')) return; try { await api('POST', { action: 'undo_changes', slug }); detail(slug); } catch (e) { msg(e.message, 'err'); } });
    $('#grant')?.addEventListener('click', async () => { try { await api('POST', { action: 'grant_round', slug }); detail(slug); } catch (e) { msg(e.message, 'err'); } });
    $('#discard').addEventListener('click', async () => {
      if (!confirm('¿Descartar esta propuesta?')) return;
      try { await api('POST', { action: 'discard', slug }); location.hash = ''; } catch (e) { msg(e.message, 'err'); }
    });
  }

  /* ---------- clientes que ya pagaron ---------- */
  const PHASE = { arranque: 'Reuniendo materiales', construccion: 'Construyendo', soporte: 'Publicada' };
  const SOL = { pendiente: 'En fila para Claude', construyendo: 'Claude la está haciendo', en_revision: 'Lista para revisar', en_proceso: 'En proceso', necesita_info: 'Esperando al cliente', aplicado: 'Aprobada y avisada', descartado: 'Descartada' };
  const DATA_LBL = { nombre_negocio: 'Nombre', giro: 'Giro', horario: 'Horario', direccion: 'Dirección', telefono: 'Teléfono', whatsapp: 'WhatsApp', correo: 'Correo', servicios: 'Servicios', colores: 'Colores', estilo: 'Estilo', redes: 'Redes', zona: 'Zona', dominio: 'Dominio', dominio_situacion: 'Dominio (situación)', dominio_proveedor: 'Proveedor del dominio', logo_web: 'Logo de su página', fotos_web: 'Fotos de su página', sin_logo: 'Sin logo', sin_fotos: 'Sin fotos', notas: 'Notas' };
  const link = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`;

  async function clients() {
    app.innerHTML = '<p class="empty">Cargando…</p>';
    const { clients: cs } = await api('GET', null, '?action=clients');
    $('#logout').hidden = false;
    const rank = c => (c.needs_human ? 0 : c.revisar ? 1 : c.urgente ? 2 : c.pendientes ? 3 : 4);
    cs.sort((a, b) => rank(a) - rank(b));
    const rows = cs.map(c => `<tr class="row" data-slug="${esc(c.slug)}" tabindex="0">
      <td><b>${esc(c.business || c.slug)}</b><small>${esc(c.plan || '')} · ${esc(c.email || '')}</small></td>
      <td><span class="st">${PHASE[c.phase] || c.phase}</span>${c.phase === 'arranque' ? `<small>Avance ${esc(c.avance)}</small>` : ''}</td>
      <td>${c.needs_human ? '<span class="st st--warn">Atender en persona</span>' : ''}${c.revisar ? ` <span class="st st--hot">${c.revisar} por revisar</span>` : ''}${c.pendientes ? ` <span class="st">${c.pendientes} en fila</span>` : ''}${c.urgente ? ' <span class="st st--warn">Urgente</span>' : ''}${!c.needs_human && !c.abiertas ? '<small>Nada pendiente</small>' : c.abiertas > c.pendientes + c.revisar ? `<small>${c.abiertas - c.pendientes - c.revisar} en curso</small>` : ''}</td>
      <td>${fmt(c.last_client_at)}<small>pagó ${fmt(c.created_at)}</small></td></tr>`).join('');
    app.innerHTML = `<h1>Clientes</h1>${cs.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Cliente</th><th>Etapa</th><th>Qué hay que hacer</th><th>Último mensaje</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">Todavía no hay clientes que hayan pagado.</p>'}`;
    app.querySelectorAll('tr.row').forEach(tr => {
      const go = () => { location.hash = `cliente/${tr.dataset.slug}`; };
      tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }

  function reportsPanel(c) {
    if (!['negocio', 'avanzado'].includes(c.plan?.id)) return '';
    const KIND = { lanzamiento: 'Análisis al lanzar', trimestral: 'Prueba trimestral en IA', mensual: 'Reporte mensual' };
    const ST = { para_cowork: 'esperando la revisión de Cowork', por_revisar: 'Cowork lo redactó: revísalo y mándalo', enviado: 'enviado al cliente' };
    const rows = (c.reports || []).map(r => {
      const v = r.data?.visibility;
      const open = r.estado === 'para_cowork' || r.estado === 'por_revisar';
      return `<div class="sol"><div class="sol-h"><b>${KIND[r.kind] || r.kind}</b><span>${fmt(r.created_at)} · ${r.estado === 'enviado' && !r.sent_at ? 'solo interno' : ST[r.estado] || r.estado}</span></div>
        ${open ? `<textarea class="seo-text" data-id="${r.id}" rows="${r.cowork_report ? 12 : 5}">${esc(r.cowork_report || r.summary || '')}</textarea>
          ${r.cowork_notes ? `<small><b>Notas de Cowork:</b> ${esc(r.cowork_notes)}</small>` : ''}
          ${r.mejora ? `<small><b>Mejora del mes que propone:</b> ${esc(r.mejora)}</small>` : ''}
          <div class="acts"><button class="btn btn-s seo-send" type="button" data-id="${r.id}">${r.estado === 'para_cowork' ? 'Mandar sin esperar a Cowork' : 'Mandar al cliente'}</button><button class="btn btn-line btn-s seo-discard" type="button" data-id="${r.id}">Descartar</button></div>`
        : `<p>${esc(r.summary || '')}</p>`}
        ${v?.results?.length ? `<small>${v.results.map(x => `${x.mentioned ? '✓' : x.error ? '!' : '✗'} ${esc(x.provider)}${x.via === 'chat' ? ' (chat)' : ''}: «${esc(x.q)}»${x.cited?.length ? ` — fuentes: ${esc(x.cited.slice(0, 4).join(', '))}` : ''}`).join('<br>')}</small>` : ''}</div>`;
    }).join('');
    return `<section class="panel"><h2>SEO y visibilidad en IA</h2>
      <small>${c.plan.id === 'avanzado' ? 'Avanzado: análisis al lanzar, reporte mensual con prueba en IA y una mejora de SEO incluida cada mes.' : 'Negocio: análisis al lanzar, prueba en IA cada 3 meses y contactos del mes.'} El servidor junta los datos solo; Claude Cowork hace la revisión a fondo y redacta el reporte; tú lo mandas desde aquí.</small>
      ${rows || '<p class="empty" style="padding:0">Todavía no hay reportes. El primero sale un día después de publicar.</p>'}
      <div class="acts"><select id="seo-kind"><option value="lanzamiento">Análisis completo</option><option value="trimestral">Prueba en IA</option><option value="mensual">Reporte mensual</option></select><button class="btn btn-line btn-s" type="button" id="seo-run">Correr ahora</button></div>
    </section>`;
  }

  function deliveryPanel(c) {
    const d = c.delivery;
    if (!d) return '';
    const step = (ok, label, body) => `<div class="dl-step${ok ? ' ok' : ''}"><b>${ok ? '✓' : '·'} ${label}</b>${body ? `<div>${body}</div>` : ''}</div>`;
    const recs = d.records?.length ? `<table class="dns"><tr><th>Tipo</th><th>Nombre</th><th>Valor</th></tr>${d.records.map(r => `<tr><td>${esc(r.tipo)}</td><td>${esc(r.nombre)}</td><td><code>${esc(r.valor)}</code></td></tr>`).join('')}</table>` : '';
    return `<section class="panel"><h2>Entrega</h2>
      ${step(d.built, 'Página construida', d.built ? link(d.preview, 'Ver su página') : 'La construye Claude cuando el cliente termina de mandar sus materiales.')}
      ${step(d.shared, 'Vista previa enviada al cliente', d.shared ? '' : 'Se envía al aprobar la solicitud «Construir la página».')}
      ${step(d.approved, 'El cliente la aprobó', d.approved ? fmt(d.approved_at) : d.built ? '<button class="btn btn-line btn-s" type="button" id="dl-approve">Marcar como aprobada</button> <small>si te lo dijo por otro medio</small>' : '')}
      ${step(d.domain_status === 'listo', 'Dominio conectado', `${!c.vercel ? '<p class="msg err">Falta VERCEL_TOKEN en Vercel para conectar dominios.</p>' : ''}
        <div class="acts"><input id="dl-domain" value="${esc(d.domain || c.data.dominio || '')}" placeholder="tunegocio.com" style="height:38px;border-radius:8px;border:1px solid #D9D8D3;padding:0 10px;font:inherit;min-width:220px"><button class="btn btn-line btn-s" type="button" id="dl-connect">${d.domain ? 'Volver a conectar' : 'Conectar dominio'}</button>${d.domain ? '<button class="btn btn-line btn-s" type="button" id="dl-check">Revisar DNS</button>' : ''}</div>
        ${d.domain ? `<small>${d.domain_status === 'listo' ? `${esc(d.domain)} ya apunta a nosotros.` : `Esperando que el cliente ponga estos registros en su DNS:`}</small>${d.domain_status === 'listo' ? '' : recs}
        ${d.domain_status === 'listo' ? '' : `<textarea id="dl-msg" placeholder="Instrucciones para el cliente"></textarea><div class="acts"><button class="btn btn-line btn-s" type="button" id="dl-send">Mandarle las instrucciones</button></div>`}` : ''}`)}
      ${step(d.published, 'Publicada y mensualidad activa', d.published ? `${link(d.live, d.live)} · ${fmt(d.published_at)}` : `<div class="acts"><button class="btn btn-primary btn-s" type="button" id="dl-publish"${d.domain ? '' : ' disabled'}>Publicar y arrancar mensualidad</button></div><small>${d.customer ? 'Cobra la primera mensualidad con la tarjeta que guardó al pagar.' : 'Este cliente no tiene cliente de Stripe: se publica sin crear mensualidad.'}</small>`)}
    </section>`;
  }

  async function client(slug) {
    app.innerHTML = '<p class="empty">Cargando…</p>';
    const { client: c, states, phases } = await api('GET', null, `?action=client&slug=${encodeURIComponent(slug)}`);
    $('#logout').hidden = false;
    const val = (k, v) => Array.isArray(v) ? (k === 'fotos_web' ? `${v.length} fotos: ${v.map((u, i) => link(u, i + 1)).join(' ')}` : esc(v.join(', '))) : k === 'logo_web' ? link(v, 'ver logo') : esc(v);
    const data = Object.entries(c.data).map(([k, v]) => `<dt>${esc(DATA_LBL[k] || k)}</dt><dd>${val(k, v)}</dd>`).join('');
    const fileTile = f => `<a href="${esc(f.url || '#')}" target="_blank" rel="noopener"><span class="th" style="${/^image\//.test(f.tipo || f.type || '') && f.url ? `background-image:url('${esc(f.url)}')` : ''}">${/^image\//.test(f.tipo || f.type || '') ? '' : esc(((f.nombre || f.name || '').split('.').pop() || '').toUpperCase())}</span>${esc(f.clase || f.kind || 'sin clasificar')} · ${esc(f.nombre || f.name)}</a>`;
    const sols = c.solicitudes.map(r => `<div class="sol" data-id="${esc(r.id)}">
        <div class="sol-h"><b>${r.tipo === 'materiales' ? 'Construir la página' : `Cambio: ${esc(r.seccion)}`}</b><span class="st ${r.estado === 'en_revision' ? 'st--hot' : r.estado === 'necesita_info' ? 'st--wait' : ''}">${SOL[r.estado] || r.estado}</span>${r.urgente ? '<span class="st st--warn">Urgente</span>' : ''}<span>${fmt(r.created_at)} · <code>${esc(r.id.slice(0, 8))}</code></span></div>
        <p>${esc(r.instruccion)}</p>
        ${r.archivos?.length ? `<div class="files">${r.archivos.map(fileTile).join('')}</div>` : ''}
        ${r.hilo?.length ? `<div class="hilo">${r.hilo.map(h => `<div class="${h.de === 'ingeniero' ? 'ing' : ''}"><em>${h.de === 'ingeniero' ? 'Equipo' : 'Cliente'} · ${fmt(h.at)}</em>${esc(h.texto)}</div>`).join('')}</div>` : ''}
        ${r.resultado ? `<div class="notes">${esc(r.resultado)}</div>` : ''}
        ${r.nota ? `<small>Nota del equipo: ${esc(r.nota)}</small>` : ''}
        ${r.tipo === 'cambio' && r.minutos ? `<small>Estimado: ${r.minutos} min</small>` : ''}
        ${['en_revision', 'aplicado'].includes(r.estado) && c.site ? `<div class="acts"><a class="btn btn-line btn-s" href="/vista/${esc(c.slug)}?sitio=1" target="_blank" rel="noopener">Ver su página</a></div>` : ''}
        ${['aplicado', 'descartado'].includes(r.estado) ? '' : r.estado === 'en_revision' ? `<label class="hint">Mensaje para el cliente (lo escribió Claude; edítalo si quieres). Le llega en su chat y por correo.</label>
        <textarea>${esc(r.mensaje_cliente || '')}</textarea>
        <div class="acts"><select>${['aplicado', 'necesita_info'].map(s => `<option value="${s}">${s === 'aplicado' ? 'Aprobar y avisar' : 'Mandar como pregunta'}</option>`).join('')}</select><button class="btn btn-primary btn-s" type="button" data-act="sol">Enviar al cliente</button><button class="btn btn-line btn-s" type="button" data-act="redo">Pedir otra versión</button></div>` : `<textarea placeholder="Mensaje para el cliente (opcional). Le llega en su chat y por correo."></textarea>
        <div class="acts"><select>${states.map(s => `<option value="${s}"${s === r.estado ? ' selected' : ''}>${SOL[s]}</option>`).join('')}</select><button class="btn btn-primary btn-s" type="button" data-act="sol">Guardar</button></div>`}
      </div>`).join('');
    app.innerHTML = `<div class="d-top"><a class="btn btn-line btn-s" href="#clientes">← Clientes</a><h1>${esc(c.business || c.slug)}</h1>
        <span class="st">${PHASE[c.phase] || c.phase}</span><span class="st">${esc(c.plan.name || '')}${c.plan.whatsapp ? ' + WhatsApp' : ''}</span>${c.phase === 'soporte' ? `<span class="st${c.plan.minutes >= c.plan.limit ? ' st--warn' : ''}">${c.plan.minutes} de ${c.plan.limit} min este mes</span>` : ''}${c.needs_human ? '<span class="st st--warn">Pidió hablar con una persona</span>' : ''}<span class="sp" style="flex:1"></span>${link(c.link, 'Abrir su chat')}</div>
      <div class="c-grid">
        <div style="display:grid;gap:16px">
          <section class="panel"><h2>Solicitudes</h2>${sols || '<p class="empty" style="padding:0">El asistente todavía no ha mandado nada al equipo.</p>'}</section>
          <section class="panel"><h2>Datos que confirmó</h2>${data ? `<dl class="kv">${data}</dl>` : '<p class="empty" style="padding:0">Todavía no hay datos.</p>'}
            ${c.phase === 'arranque' ? `<small>Avance: ${c.checklist.items.map(i => `${i.done ? '✓' : '·'} ${esc(i.label)}`).join(' &nbsp; ')}</small>` : ''}</section>
          <section class="panel"><h2>Archivos que subió</h2>${c.files.length ? `<div class="files">${c.files.map(fileTile).join('')}</div>` : '<p class="empty" style="padding:0">No ha subido archivos.</p>'}</section>
          ${deliveryPanel(c)}
          ${reportsPanel(c)}
          <section class="panel c-phase"><h2>Etapa</h2><div class="acts"><select id="ph">${phases.map(p => `<option value="${p}"${p === c.phase ? ' selected' : ''}>${PHASE[p]}</option>`).join('')}</select><button class="btn btn-line btn-s" type="button" id="ph-save">Cambiar etapa</button></div>
            <small>Cuando publiques su página, pásalo a «Publicada»: el asistente cambia a modo de soporte y recibe pedidos de cambios.</small></section>
          <p class="msg" id="msg" role="status"></p>
        </div>
        <section class="panel"><h2>Conversación</h2>
          <div class="convo" id="convo">${c.messages.map(m => `<div class="${m.who}">${esc(m.text)}${m.files?.length ? `<small>📎 ${m.files.map(esc).join(', ')}</small>` : ''}</div>`).join('') || '<p class="empty" style="padding:0">El cliente todavía no escribe.</p>'}</div>
          <div class="c-send"><textarea id="cm" placeholder="Escríbele al cliente. Le aparece en su chat y le llega por correo."></textarea>
          <div class="acts" style="margin-top:8px"><button class="btn btn-primary btn-s" type="button" id="cm-send">Enviar al cliente</button></div></div>
        </section>
      </div>`;
    const convo = $('#convo'); convo.scrollTop = convo.scrollHeight;
    const msg = (t, k = '') => { const m = $('#msg'); m.textContent = t; m.className = `msg ${k}`; };
    const run = async (body, done) => { try { await api('POST', { slug, ...body }); client(slug); } catch (e) { msg(e.message, 'err'); } };
    $('#cm-send').addEventListener('click', () => run({ action: 'client_message', mensaje: $('#cm').value }));
    $('#dl-approve')?.addEventListener('click', () => run({ action: 'site_approve' }));
    $('#seo-run')?.addEventListener('click', async e => {
      e.target.disabled = true; msg('Corriendo análisis y preguntas a la IA… puede tardar hasta un minuto.');
      try { const r = await api('POST', { slug, action: 'seo_run', kind: $('#seo-kind').value }); await client(slug); msg(r.waiting ? `Listo. Queda esperando ${r.waiting}.` : 'Listo.', 'ok'); }
      catch (err) { msg(err.message, 'err'); e.target.disabled = false; }
    });
    document.querySelectorAll('.seo-send').forEach(b => b.addEventListener('click', async () => {
      const text = document.querySelector(`.seo-text[data-id="${b.dataset.id}"]`)?.value || '';
      if (!confirm('¿Mandar este reporte al cliente por su chat y correo?')) return;
      b.disabled = true;
      try { await api('POST', { slug, action: 'seo_send', id: b.dataset.id, text }); await client(slug); msg('Reporte enviado.', 'ok'); }
      catch (err) { msg(err.message, 'err'); b.disabled = false; }
    }));
    document.querySelectorAll('.seo-discard').forEach(b => b.addEventListener('click', () => run({ action: 'seo_discard', id: b.dataset.id })));
    $('#dl-connect')?.addEventListener('click', async () => {
      try { const r = await api('POST', { slug, action: 'site_domain', domain: $('#dl-domain').value }); await client(slug); if ($('#dl-msg')) $('#dl-msg').value = r.message; }
      catch (e) { msg(e.message, 'err'); }
    });
    $('#dl-check')?.addEventListener('click', async () => {
      try { const r = await api('POST', { slug, action: 'site_check' }); await client(slug); msg(r.ready ? `${r.domain} ya apunta a nosotros.` : `${r.domain} todavía no apunta. El DNS puede tardar unas horas.`, r.ready ? 'ok' : ''); }
      catch (e) { msg(e.message, 'err'); }
    });
    if ($('#dl-msg') && !$('#dl-msg').value) api('POST', { slug, action: 'site_dns_message' }).then(r => { if ($('#dl-msg') && !$('#dl-msg').value) $('#dl-msg').value = r.message || ''; }).catch(() => {});
    $('#dl-send')?.addEventListener('click', () => run({ action: 'client_message', mensaje: $('#dl-msg').value }));
    $('#dl-publish')?.addEventListener('click', async () => {
      const d = c.delivery;
      const warn = [!d.approved && 'el cliente todavía no la aprueba', d.domain_status !== 'listo' && 'su dominio todavía no apunta a nosotros'].filter(Boolean);
      if (!confirm(warn.length ? `Ojo: ${warn.join(' y ')}. ¿Publicar de todos modos?` : '¿Publicar su página y arrancar su mensualidad?')) return;
      try { const r = await api('POST', { slug, action: 'site_publish', force: warn.length > 0 }); await client(slug); msg(`Publicada en ${r.live}.${r.billing?.skipped ? ' ' + r.billing.skipped : ' Mensualidad: ' + (r.billing?.status || 'creada') + '.'}`, 'ok'); }
      catch (e) { msg(e.message, 'err'); }
    });
    $('#ph-save').addEventListener('click', () => run({ action: 'client_phase', phase: $('#ph').value }));
    app.querySelectorAll('[data-act="sol"]').forEach(b => b.addEventListener('click', () => {
      const box = b.closest('.sol');
      run({ action: 'request_update', solicitud: box.dataset.id, estado: box.querySelector('select').value, mensaje: box.querySelector('textarea').value });
    }));
    app.querySelectorAll('[data-act="redo"]').forEach(b => b.addEventListener('click', () => {
      const nota = prompt('¿Qué debe cambiar Claude en la siguiente versión?');
      if (nota && nota.trim()) run({ action: 'request_update', solicitud: b.closest('.sol').dataset.id, estado: 'pendiente', nota: nota.trim() });
    }));
  }

  const route = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    const tab = h === 'clientes' || h.startsWith('cliente/') ? 'cli' : 'prop';
    $('#tabs').hidden = false;
    $('#tabs').querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
    const slug = h;
    (h === 'clientes' ? clients() : h.startsWith('cliente/') ? client(h.slice(8)) : slug ? detail(slug) : list()).catch(err => { if (err.message !== 'Sesión vencida') app.innerHTML = `<p class="msg err">${esc(err.message)}</p>`; });
  };
  addEventListener('hashchange', route);
  $('#logout').addEventListener('click', async () => { await api('POST', { action: 'logout' }).catch(() => {}); login(); });
  route();
})();
</script>
</body>
</html>

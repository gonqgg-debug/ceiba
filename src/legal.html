<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{L_TITLE}} · Ceiba Labs</title>
<meta name="description" content="{{L_DESC}}">
<meta name="robots" content="{{L_ROBOTS}}">
<link rel="canonical" href="{{L_CANON}}">
{{HEAD_TAGS}}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Funnel+Display:wght@500;600&family=Geist:wght@400;500;600&display=swap">
<style>
{{BASE_CSS}}
.lg{background:var(--ivory);color:#1E1F24;padding:clamp(48px,7vw,96px) 0}
.lg .wrap{max-width:760px}
.lg h1{font:400 clamp(40px,6vw,60px)/1.05 var(--f-display);color:#0C1226;margin:0 0 10px}
.lg .upd{color:#6B6E76;font-size:15px;margin:0 0 36px}
.lg h2{font:600 21px/1.3 var(--f-body);color:#0C1226;margin:38px 0 10px}
.lg p,.lg li{font-size:17px;line-height:1.7;color:#2A2C33}
.lg ul{padding-left:22px;margin:0 0 12px}
.lg li{margin:6px 0}
.lg a{color:#14246B;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
{{SYMBOLS}}
<header class="site-header" id="top"></header>
<main class="lg"><div class="wrap">
  <h1>{{L_TITLE}}</h1>
  <p class="upd">Última actualización: {{L_UPDATED}}</p>
  {{L_BODY}}
</div></main>
<footer class="band footer"></footer>
</body>
</html>
